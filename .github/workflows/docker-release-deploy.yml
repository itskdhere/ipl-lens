name: Docker Build, Release & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Custom Docker Image Tag (e.g. v1.0.0-rc1 or staging)"
        required: false
        type: string
        default: ""

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ipl-lens-app
            target: runner
          - name: ipl-lens-setup
            target: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image.name }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}/{2}', env.REGISTRY_DOCKERHUB, env.DOCKERHUB_USERNAME, matrix.image.name) || '' }}
          tags: |
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag' }}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.custom_tag != '' && github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Notes Body
        id: release_body
        run: |
          TAG="${{ inputs.custom_tag != '' && inputs.custom_tag || github.ref_name }}"
          BODY="## Published Container Images

          The following Docker images were built and pushed for this release:

          ### GitHub Container Registry (GHCR)
          - \`ghcr.io/${{ github.repository_owner }}/ipl-lens-app:${TAG}\`
          - \`ghcr.io/${{ github.repository_owner }}/ipl-lens-setup:${TAG}\`"

          if [ -n "$DOCKERHUB_USERNAME" ]; then
            BODY="${BODY}

          ### Docker Hub
          - \`docker.io/${DOCKERHUB_USERNAME}/ipl-lens-app:${TAG}\`
          - \`docker.io/${DOCKERHUB_USERNAME}/ipl-lens-setup:${TAG}\`"
          fi

          BODY="${BODY}

          ---
          *Built from commit:* \`${{ github.sha }}\`"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.custom_tag != '' && inputs.custom_tag || github.ref_name }}
          name: Release ${{ inputs.custom_tag != '' && inputs.custom_tag || github.ref_name }}
          body: ${{ steps.release_body.outputs.body }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.custom_tag != '' && inputs.custom_tag || github.ref_name, '-rc') || contains(inputs.custom_tag != '' && inputs.custom_tag || github.ref_name, '-beta') || contains(inputs.custom_tag != '' && inputs.custom_tag || github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-render:
    name: Auto Deploy to Render
    needs: build-and-push
    if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render auto-deployment via Deploy Hook..."
          curl -f -s -S -X POST "${{ env.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy hook triggered successfully!"
